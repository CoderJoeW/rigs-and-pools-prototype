# fly.toml app configuration file generated for rigs-and-pools-prototype on 2026-08-25T03:36:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rigs-and-pools-prototype'
primary_region = 'iad'

[build]

[env]
  RAP_CORS_ALLOWED_ORIGINS = 'https://coderjoew.github.io,http://localhost:5173'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'
    method = 'GET'
    path = '/actuator/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
