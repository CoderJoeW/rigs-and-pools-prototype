app = 'rigs-and-pools-prototype'
primary_region = 'iad'

[build]

[env]
  RAP_CORS_ALLOWED_ORIGINS = 'https://coderjoew.github.io,http://localhost:5173'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [[http_service.checks]]
    method = 'GET'
    path = '/actuator/health'
    interval = '30s'
    timeout = '5s'
    grace_period = '40s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
